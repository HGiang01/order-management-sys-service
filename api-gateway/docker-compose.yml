services:
  keycloak-db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=keycloak
      - MYSQL_PASSWORD=keycloak
      - MYSQL_DATABASE=keycloak
    volumes:
      - ./volume-data/mysql_keycloack_data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    environment:
      # Set the Keycloak admin username and password
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Configure Keycloak to run in development mode and listen on all interfaces
      - KC_HOSTNAME=localhost
      - KC_HTTP_PORT=8080
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HOSTNAME_STRICT_BACKCHANNEL=false
      # Enable debug logging and metrics
      - KC_LOG_LEVEL=DEBUG
      - KC_METRICS_ENABLED=true
      - KC_HEALTH_ENABLED=true
      # Configure Keycloak to use MySQL as the database
      - KC_DB=mysql
      - KC_DB_URL=jdbc:mysql://keycloak-db:3306/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
    ports:
      - "8180:8080"
    command: [ "start-dev", "--import-realm" ]
    depends_on:
      - keycloak-db