# authSource= this is a database where root user is created, in this case it is admin database.
# If you have created root user in different database then you need to change authSource value accordingly.
spring.data.mongodb.uri=mongodb://root:example@localhost:27017/product-service?authSource=admin
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs